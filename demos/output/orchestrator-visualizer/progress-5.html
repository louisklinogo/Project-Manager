<div class="research-progress-visualizer">
  <style>
    .research-progress-visualizer {
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;
      color: #333333;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #dddddd;
      max-width: 800px;
      margin: 0 auto;
    }

    .research-progress-visualizer h1,
    .research-progress-visualizer h2,
    .research-progress-visualizer h3 {
      margin-top: 0;
      color: #333333;
    }

    .research-progress-visualizer .progress-bar-container {
      width: 100%;
      height: 20px;
      background-color: #eeeeee;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
    }

    .research-progress-visualizer .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .research-progress-visualizer .progress-bar-fill.low {
      background-color: #e74c3c;
    }

    .research-progress-visualizer .progress-bar-fill.medium {
      background-color: #f39c12;
    }

    .research-progress-visualizer .progress-bar-fill.high {
      background-color: #2ecc71;
    }

    .research-progress-visualizer .progress-bar-fill.complete {
      background-color: #27ae60;
    }

    .research-progress-visualizer .status {
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
    }

    .research-progress-visualizer .status.info {
      background-color: #3498db22;
      border-left: 4px solid #3498db;
    }

    .research-progress-visualizer .status.warning {
      background-color: #f39c1222;
      border-left: 4px solid #f39c12;
    }

    .research-progress-visualizer .status.error {
      background-color: #e74c3c22;
      border-left: 4px solid #e74c3c;
    }

    .research-progress-visualizer .status.success {
      background-color: #2ecc7122;
      border-left: 4px solid #2ecc71;
    }

    .research-progress-visualizer .status.debug {
      background-color: #95a5a622;
      border-left: 4px solid #95a5a6;
    }

    .research-progress-visualizer .status-icon {
      margin-right: 8px;
    }

    .research-progress-visualizer .status-timestamp {
      font-size: 0.8em;
      color: #33333399;
      margin-left: 10px;
    }

    .research-progress-visualizer table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
    }

    .research-progress-visualizer th,
    .research-progress-visualizer td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #dddddd;
    }

    .research-progress-visualizer th {
      background-color: #ffffff88;
      font-weight: bold;
    }

    .research-progress-visualizer .memory-aid {
      background-color: #ffffff88;
      border: 1px solid #dddddd;
      border-radius: 5px;
      padding: 10px;
      margin: 15px 0;
    }

    .research-progress-visualizer .memory-aid h3 {
      margin-top: 0;
    }

    .research-progress-visualizer .memory-aid ul {
      margin: 0;
      padding-left: 20px;
    }

    .research-progress-visualizer .collapsible {
      cursor: pointer;
      padding: 10px;
      width: 100%;
      border: none;
      text-align: left;
      outline: none;
      background-color: #ffffff88;
      border-radius: 5px;
      margin: 5px 0;
      font-weight: bold;
    }

    .research-progress-visualizer .collapsible:after {
      content: "\002B"; /* Unicode character for "plus" sign (+) */
      float: right;
    }

    .research-progress-visualizer .active:after {
      content: "\2212"; /* Unicode character for "minus" sign (-) */
    }

    .research-progress-visualizer .collapsible-content {
      padding: 0 10px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease-out;
      background-color: #ffffff;
    }

    @media (prefers-reduced-motion: reduce) {
      .research-progress-visualizer .progress-bar-fill,
      .research-progress-visualizer .collapsible-content {
        transition: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      .research-progress-visualizer.auto-theme {
        color: #ffffff;
        background-color: #1e1e1e;
      }

      .research-progress-visualizer.auto-theme h1,
      .research-progress-visualizer.auto-theme h2,
      .research-progress-visualizer.auto-theme h3 {
        color: #ffffff;
      }

      .research-progress-visualizer.auto-theme .progress-bar-container {
        background-color: #444444;
      }
    }
  </style>
  <h2>demo-research-operation</h2>

  <div
    class="progress-bar-container"
    role="progressbar"
    aria-valuenow="5"
    aria-valuemin="0"
    aria-valuemax="100"
  >
    <div class="progress-bar-fill low" style="width: 5%"></div>
  </div>
  <div class="progress-text">5% Complete</div>

  <div class="status info" role="alert">
    <span class="status-icon" aria-hidden="true">&#8505;</span>
    <span class="status-message">Starting Plan Preparation phase</span>
  </div>

  <p><strong>Estimated time remaining:</strong> Unknown</p>

  <script>
    // Add click event listeners to collapsible elements
    document.addEventListener("DOMContentLoaded", function () {
      var collapsibles = document.querySelectorAll(
        ".research-progress-visualizer .collapsible",
      );

      for (var i = 0; i < collapsibles.length; i++) {
        collapsibles[i].addEventListener("click", function () {
          this.classList.toggle("active");
          var content = this.nextElementSibling;

          if (content.style.maxHeight) {
            content.style.maxHeight = null;
          } else {
            content.style.maxHeight = content.scrollHeight + "px";
          }
        });
      }
    });
  </script>
</div>
